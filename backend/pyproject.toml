[project]
name = "l2d-ai-backend"
version = "0.1.0"
description = "Live2D AI assistant backend (DeepSeek agent service)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "sse-starlette>=2.1.0",
  "langchain>=1.4",
  "langchain-deepseek>=1.1",
  "tzdata>=2026.5",
  "jieba>=0.42.1",
  "beautifulsoup4>=4.15.0",
  "openai>=3.37.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
